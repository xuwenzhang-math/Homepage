<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Central patch of an immersed disk</title>
<style>
:root{color-scheme:light;--foreground:#202124;--viz-series-1:#339cff;--viz-series-2:#f3883b;--viz-series-3:#5dc977}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#fff;color:var(--foreground);font-family:'Times New Roman',Times,serif;font-size:18px;line-height:1.45}
.diagram-grid{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,2.4fr);gap:8px;align-items:start}
.diagram-grid figure{margin:0;min-width:0}
.diagram-grid figcaption{text-align:center;line-height:1.35;margin-top:6px}
.disk-stage,.map-arrow{height:400px;display:flex;align-items:center;justify-content:center}
.disk-stage svg{display:block;width:100%;max-width:190px;height:auto}
.map-arrow svg{display:block;width:100%;height:auto}
.diagram-note{text-align:right;margin:10px 0 0}
.text-small{font-size:16px}
.text-muted{color:#5f6368}
.viz-controls{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 22px;flex-wrap:wrap;margin-top:8px}
.form-label{display:flex;flex-direction:column;gap:5px}
.form-select{font:inherit;color:inherit;background:#fff;border:1px solid #bdc1c6;border-radius:3px;padding:4px 8px;min-height:36px}
.form-range{width:200px;max-width:100%;height:30px;margin:0}
.form-check{display:flex;align-items:center;gap:7px;min-height:36px}
.form-check-input{width:17px;height:17px;margin:0}
input:focus-visible,select:focus-visible{outline:2px solid #0645ad;outline-offset:3px}
@media(max-width:480px){body{padding:14px;font-size:17px}.diagram-grid{grid-template-columns:minmax(0,1fr) 34px minmax(0,2.4fr);gap:4px}.disk-stage,.map-arrow{height:300px}.diagram-grid figcaption{font-size:16px}.viz-controls{gap:12px 18px}.form-range{width:170px}}
</style>
</head>
<body>
<div id="central-patch-enlarged">
  <style>
    #central-patch-enlarged { color: var(--foreground); }
    #central-patch-enlarged .patch-stage { position: relative; width: 100%; height: 400px; }
    #central-patch-enlarged .patch-stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #central-patch-enlarged .patch-stage canvas:active { cursor: grabbing; }
    #central-patch-enlarged .patch-loading { position: absolute; inset: 0; display: grid; place-items: center; }
    #central-patch-enlarged .patch-loading[hidden] { display: none; }
    @media (max-width: 480px) { #central-patch-enlarged .patch-stage { height: 300px; } }
  </style>
  <div class="diagram-grid">
    <figure>
      <div class="disk-stage">
        <svg viewBox="0 0 200 200" role="img" aria-label="The closed unit parameter disk D, divided into three sectors: blue at the upper right, orange at the left, and green at the lower right.">
          <path d="M100 100 L180 100 A80 80 0 0 0 60 30.718 Z" fill="var(--viz-series-1)"/>
          <path d="M100 100 L60 30.718 A80 80 0 0 0 60 169.282 Z" fill="var(--viz-series-2)"/>
          <path d="M100 100 L60 169.282 A80 80 0 0 0 180 100 Z" fill="var(--viz-series-3)"/>
          <circle cx="100" cy="100" r="80" fill="none" stroke="var(--foreground)" stroke-width="1.5"/>
          <text x="100" y="110" text-anchor="middle" font-size="27" font-style="italic" fill="var(--foreground)">D</text>
          <path d="M92 85 H111" stroke="var(--foreground)" stroke-width="1.2"/>
        </svg>
      </div>
      <figcaption>Parameter disk</figcaption>
    </figure>
    <div class="map-arrow" role="img" aria-label="Mapped by F">
      <svg viewBox="0 0 70 80" aria-hidden="true">
        <text x="35" y="27" text-anchor="middle" font-size="24" font-style="italic" fill="var(--foreground)">F</text>
        <path d="M5 45 H65 M54 37 L65 45 L54 53" fill="none" stroke="var(--foreground)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <figure>
      <div class="patch-stage" role="img" aria-label="Central patch of the immersed disk, with parameter radius at most 0.46. Colors distinguish three sectors of the same parameter disk. The edge is a cut edge, not the original boundary. Drag to rotate or use the view controls below.">
        <div class="patch-loading" data-loading>Rendering the central patch…</div>
      </div>
      <figcaption>Central patch (enlarged)</figcaption>
    </figure>
  </div>
  <p class="diagram-note text-small text-muted">Central patch: parameter radius 0.46 · Equal axis scales</p>
  <div class="viz-controls">
    <label class="form-label">View
      <select class="form-select" data-view aria-label="Choose a viewing direction">
        <option value="oblique">Oblique</option>
        <option value="top">Top</option>
        <option value="side">Side</option>
        <option value="free">Free rotation</option>
      </select>
    </label>
    <label class="form-label">Zoom: <span class="tabular-nums" data-zoom-label>1.00×</span>
      <input class="form-range" type="range" min="0.7" max="2.5" step="0.01" value="1" data-zoom aria-label="Uniform zoom">
    </label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-transparent><span class="form-check-label">Translucent</span></label>
  </div>
  <script>
    (async () => {
      const root = document.getElementById('central-patch-enlarged');
      const stage = root.querySelector('.patch-stage');
      const loading = root.querySelector('[data-loading]');
      try {
        const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
        const TAU = 2 * Math.PI, radius = 0.46;
        let yaw = -0.8, pitch = 0.43, zoom = 1, drag = null;
        const view = root.querySelector('[data-view]');
        const zoomInput = root.querySelector('[data-zoom]');
        const transparent = root.querySelector('[data-transparent]');
        const probe = document.createElement('span'); probe.hidden = true; root.appendChild(probe);
        const colorCanvas = document.createElement('canvas'); colorCanvas.width = colorCanvas.height = 1;
        const ctx = colorCanvas.getContext('2d', {willReadFrequently: true});
        function theme(token) {
          probe.style.color = `var(${token})`;
          ctx.clearRect(0, 0, 1, 1); ctx.fillStyle = getComputedStyle(probe).color; ctx.fillRect(0, 0, 1, 1);
          const c = ctx.getImageData(0, 0, 1, 1).data;
          return new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
        }
        function F(x, y) {
          const q = 1 - x*x - y*y;
          return new THREE.Vector3(x*x*x - 3*x*y*y - q*x/12,
            3*x*x*y - y*y*y + q*y/12, q*(x*x-y*y)/2);
        }
        function normal(x, y) {
          const r2 = x*x+y*y;
          const dx = new THREE.Vector3(3*x*x - 3*y*y - (1-r2)/12 + x*x/6,
            6*x*y - x*y/6, x - 2*x*x*x);
          const dy = new THREE.Vector3(-6*x*y + x*y/6,
            3*x*x - 3*y*y + (1-r2)/12 - y*y/6, -y + 2*y*y*y);
          return dx.cross(dy).normalize();
        }
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({alpha: true, antialias: true});
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.setClearAlpha(0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.domElement.setAttribute('aria-hidden', 'true'); stage.insertBefore(renderer.domElement, stage.firstChild);
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.001, 20);
        camera.up.set(0, 0, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 1.4));
        const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(3, -4, 6); scene.add(key);
        const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-3, 2, -4); scene.add(fill);
        const materials = [], meshes = [];
        const bounds = new THREE.Box3();
        for (let sector = 0; sector < 3; ++sector) {
          const positions = [], normals = [], indices = [], nr = 100, nt = 128;
          for (let i = 0; i <= nr; ++i) {
            const r = radius * i / nr;
            for (let j = 0; j <= nt; ++j) {
              const theta = TAU * (sector + j / nt) / 3;
              const x = r*Math.cos(theta), y = r*Math.sin(theta);
              const p = F(x, y), n = normal(x, y);
              positions.push(p.x, p.y, p.z); normals.push(n.x, n.y, n.z); bounds.expandByPoint(p);
            }
          }
          for (let i = 0; i < nr; ++i) for (let j = 0; j < nt; ++j) {
            const a = i*(nt+1)+j, b = a+nt+1;
            if (i) indices.push(a, b, a+1);
            indices.push(a+1, b, b+1);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
          g.setIndex(indices);
          const material = new THREE.MeshStandardMaterial({color: theme(`--viz-series-${sector+1}`),
            roughness: 0.68, metalness: 0, side: THREE.DoubleSide, transparent: false, opacity: 1, depthWrite: true});
          const mesh = new THREE.Mesh(g, material); materials.push(material); meshes.push(mesh); scene.add(mesh);
        }
        const center = bounds.getCenter(new THREE.Vector3());
        let size = 0;
        for (const mesh of meshes) {
          const positions = mesh.geometry.getAttribute('position');
          for (let i = 0; i < positions.count; ++i) {
            size = Math.max(size, new THREE.Vector3().fromBufferAttribute(positions, i).distanceTo(center));
          }
        }
        const edgePoints = [];
        for (let i = 0; i < 768; ++i) {
          const theta = TAU*i/768; edgePoints.push(F(radius*Math.cos(theta), radius*Math.sin(theta)));
        }
        const edgeMaterial = new THREE.MeshBasicMaterial({color: theme('--foreground')});
        const edgeCurve = new THREE.CatmullRomCurve3(edgePoints, true, 'centripetal');
        const edge = new THREE.Mesh(new THREE.TubeGeometry(edgeCurve, 768, size*0.002, 6, true), edgeMaterial);
        scene.add(edge);
        function render() {
          const aspect = Math.max(0.25, stage.clientWidth/stage.clientHeight);
          const halfHeight = size*1.14/Math.min(1, aspect)/zoom;
          camera.left = -halfHeight*aspect; camera.right = halfHeight*aspect;
          camera.top = halfHeight; camera.bottom = -halfHeight;
          camera.updateProjectionMatrix();
          camera.position.set(center.x+size*6*Math.cos(pitch)*Math.cos(yaw),
            center.y+size*6*Math.cos(pitch)*Math.sin(yaw), center.z+size*6*Math.sin(pitch));
          camera.lookAt(center); renderer.render(scene, camera);
        }
        view.addEventListener('change', () => {
          if (view.value === 'oblique') { yaw = -0.8; pitch = 0.43; }
          if (view.value === 'top') { yaw = -Math.PI/2; pitch = Math.PI/2-0.0001; }
          if (view.value === 'side') { yaw = -Math.PI/2; pitch = 0; }
          render();
        });
        function updateZoom(value) {
          zoom = Math.max(0.7, Math.min(2.5, value)); zoomInput.value = zoom.toFixed(2);
          root.querySelector('[data-zoom-label]').textContent = `${zoom.toFixed(2)}×`; render();
        }
        zoomInput.addEventListener('input', () => updateZoom(Number(zoomInput.value)));
        transparent.addEventListener('change', () => {
          materials.forEach(m => { m.transparent = transparent.checked; m.opacity = transparent.checked ? 0.28 : 1;
            m.depthWrite = !transparent.checked; m.needsUpdate = true; });
          render();
        });
        renderer.domElement.addEventListener('pointerdown', e => {
          drag = [e.clientX, e.clientY]; renderer.domElement.setPointerCapture(e.pointerId);
        });
        renderer.domElement.addEventListener('pointermove', e => {
          if (!drag) return;
          yaw -= (e.clientX-drag[0])*0.007;
          pitch = Math.max(-Math.PI/2+0.0001, Math.min(Math.PI/2-0.0001, pitch+(e.clientY-drag[1])*0.007));
          drag = [e.clientX, e.clientY]; view.value = 'free'; render();
        });
        renderer.domElement.addEventListener('pointerup', () => { drag = null; });
        renderer.domElement.addEventListener('pointercancel', () => { drag = null; });
        renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); updateZoom(zoom*Math.exp(-e.deltaY*0.001)); }, {passive: false});
        function resize() { renderer.setSize(stage.clientWidth, stage.clientHeight, false); render(); }
        new ResizeObserver(resize).observe(stage);
        function recolor() {
          materials.forEach((m, i) => m.color.copy(theme(`--viz-series-${i+1}`)));
          edgeMaterial.color.copy(theme('--foreground')); render();
        }
        new MutationObserver(recolor).observe(document.documentElement, {attributes: true, attributeFilter: ['class', 'style', 'data-theme']});
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
        resize(); loading.hidden = true;
      } catch (error) {
        loading.textContent = 'The 3D view could not load. Please reload the page.'; loading.setAttribute('role', 'alert'); console.error(error);
      }
    })();
  </script>
</div>
</body>
</html>
